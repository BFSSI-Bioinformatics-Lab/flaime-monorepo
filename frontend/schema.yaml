  /api/token-auth/:
    post:
      operationId: token_auth_create
      tags:
      - token-auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
