openapi: 3.0.3
info:
  title: flaime-py API
  version: 1.0.0
  description: Documentation of API endpoints of flaime-py
paths:
  /api/categories/:
    get:
      operationId: categories_list
      description: Get hierarchical category tree with optional scheme filtering
      parameters:
      - in: query
        name: scheme
        schema:
          type: integer
        description: Filter categories by scheme ID
      tags:
      - categories
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTree'
          description: ''
  /api/category-verifications/{id}/update_verification/:
    put:
      operationId: category_verifications_update_verification_update
      description: Update an existing category verification
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Manually Verified Category.
        required: true
      tags:
      - category-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualCategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualCategoryUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCategoryUpdate'
          description: ''
    patch:
      operationId: category_verifications_update_verification_partial_update
      description: Update an existing category verification
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Manually Verified Category.
        required: true
      tags:
      - category-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedManualCategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedManualCategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedManualCategoryUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCategoryUpdate'
          description: ''
  /api/category-verifications/create_verification/:
    post:
      operationId: category_verifications_create_verification_create
      description: Create a new category verification
      tags:
      - category-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCategoryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualCategoryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualCategoryCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCategoryCreate'
          description: ''
  /api/category-verifications/get_predictions/:
    get:
      operationId: category_verifications_get_predictions_retrieve
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of items per page (max 200)
      - in: query
        name: problematic
        schema:
          type: boolean
        description: Return only problematic manual verifications
      - in: query
        name: scheme
        schema:
          type: integer
        description: Scheme ID to filter predictions
        required: true
      - in: query
        name: source
        schema:
          type: integer
        description: Source ID to filter store products
        required: true
      - in: query
        name: stats_only
        schema:
          type: boolean
          default: false
        description: Return only counts instead of full product data
      - in: query
        name: user
        schema:
          type: integer
        description: User ID for filtering verified products
      - in: query
        name: verified
        schema:
          type: boolean
        description: Return verified products (requires user parameter)
      tags:
      - category-verifications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Success
  /api/categoryschemes/:
    get:
      operationId: categoryschemes_list
      tags:
      - categoryschemes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryScheme'
          description: ''
  /api/categoryschemes/{id}/:
    get:
      operationId: categoryschemes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Category Scheme.
        required: true
      tags:
      - categoryschemes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedCategoryScheme'
          description: ''
  /api/categoryschemes/full/:
    get:
      operationId: categoryschemes_full_retrieve
      tags:
      - categoryschemes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedCategoryScheme'
          description: ''
  /api/nutrients/:
    get:
      operationId: nutrients_list
      tags:
      - nutrients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimpleNutrient'
          description: ''
  /api/nutrients/{id}/:
    get:
      operationId: nutrients_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Nutrient.
        required: true
      tags:
      - nutrients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedNutrient'
          description: ''
  /api/nutrients/full/:
    get:
      operationId: nutrients_full_retrieve
      tags:
      - nutrients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedNutrient'
          description: ''
  /api/options/:
    get:
      operationId: options_retrieve
      tags:
      - options
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOptionsResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/sources/:
    get:
      operationId: sources_list
      tags:
      - sources
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimpleSource'
          description: ''
  /api/sources/{id}/:
    get:
      operationId: sources_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Source.
        required: true
