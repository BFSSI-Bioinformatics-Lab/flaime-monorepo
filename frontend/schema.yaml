      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    AllergensWarning:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        contains_en:
          type: string
          nullable: true
        contains_fr:
          type: string
          nullable: true
        may_contain_en:
          type: string
          nullable: true
        may_contain_fr:
          type: string
          nullable: true
      required:
      - id
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    CategoryScheme:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        category_count:
          type: integer
          readOnly: true
      required:
      - category_count
      - id
      - name
    CategoryTree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 512
        code:
          type: string
          maxLength: 256
        scheme:
          type: string
          readOnly: true
        level:
          type: integer
          maximum: 2147483647
          minimum: 0
        verification_info:
          type: object
          nullable: true
          properties:
            verified_by:
              type: string
              format: email
            date_added:
              type: string
              format: date-time
            problematic:
              type: boolean
            notes:
              type: string
          readOnly: true
        prediction_info:
          type: object
          nullable: true
          properties:
            model:
              type: string
            confidence:
              type: number
              format: float
            date_predicted:
              type: string
              format: date-time
          readOnly: true
        children:
          type: string
          readOnly: true
      required:
      - children
      - code
      - id
      - name
      - prediction_info
      - scheme
      - verification_info
    DetailedCategoryScheme:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        category_count:
          type: integer
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTreeSerializer'
          readOnly: true
      required:
      - categories
      - category_count
      - id
      - name
    DetailedNutrient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_datetime:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          nullable: true
          maxLength: 256
        modified_datetime:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: string
          nullable: true
          maxLength: 256
        deleted_datetime:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          nullable: true
          maxLength: 256
        deleted:
          type: boolean
        nutrient_code:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        name:
          type: string
          maxLength: 256
        symbol:
          type: string
          maxLength: 256
        usda_nutrient_code:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        parent:
          type: integer
          nullable: true
      required:
      - created_datetime
      - id
      - modified_datetime
      - name
      - nutrient_code
      - symbol
    DetailedSource:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_datetime:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          nullable: true
          maxLength: 256
        modified_datetime:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: string
          nullable: true
          maxLength: 256
        deleted_datetime:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          nullable: true
          maxLength: 256
        deleted:
          type: boolean
          default: false
        name:
          type: string
          maxLength: 512
      required:
      - created_datetime
      - id
      - modified_datetime
      - name
    DetailedStore:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_datetime:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          nullable: true
          maxLength: 256
        modified_datetime:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: string
          nullable: true
          maxLength: 256
        deleted_datetime:
          type: string
          format: date-time
          nullable: true
        deleted_by:
          type: string
          nullable: true
          maxLength: 256
        deleted:
          type: boolean
          default: false
        name:
          type: string
          maxLength: 512
      required:
      - created_datetime
      - id
      - modified_datetime
      - name
    DetailedStoreProduct:
      type: object
      properties:
        id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        store_product_code:
          type: string
          maxLength: 512
        sku:
          type: string
          nullable: true
          maxLength: 512
        price:
          type: number
          format: double
          nullable: true
        brand:
          type: string
          readOnly: true
        raw_brand:
          type: string
          nullable: true
          maxLength: 256
        site_name:
          type: string
          nullable: true
          maxLength: 512
        site_description:
          type: string
          nullable: true
          maxLength: 10240
        nutrition_facts_json:
          nullable: true
        total_size:
          type: string
          nullable: true
          maxLength: 500
        raw_serving_size:
          type: string
          nullable: true
          maxLength: 500
        raw_upc:
          type: string
          nullable: true
          maxLength: 512
        nielsen_upc:
          type: string
          nullable: true
          maxLength: 124
        upcs:
          type: array
          items:
            $ref: '#/components/schemas/UPC'
          readOnly: true
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              manual:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryListSerializer'
              predicted:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryListSerializer'
          readOnly: true
        private_label:
          type: string
          nullable: true
          maxLength: 4096
        tags:
          type: string
          nullable: true
          maxLength: 2048
        store:
          type: string
          readOnly: true
