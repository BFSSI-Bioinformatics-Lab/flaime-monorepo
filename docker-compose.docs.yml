services:
  docs:
    image: flaime_py_local_docs
    container_name: flaime_py_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./flaime_py:/app/flaime_py:z
    ports:
      - '9000:9000'
    command: /start-docs
