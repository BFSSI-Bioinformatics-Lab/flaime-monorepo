openapi: 3.0.3
info:
  title: flaime-py API
  version: 1.0.0
  description: Documentation of API endpoints of flaime-py
paths:
  /api/categories/:
    get:
      operationId: categories_list
      description: Get hierarchical category tree with optional scheme filtering
      parameters:
      - in: query
        name: scheme
        schema:
          type: integer
        description: Filter categories by scheme ID
      tags:
      - categories
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTree'
          description: ''
  /api/category-verifications/{id}/update_verification/:
    put:
      operationId: category_verifications_update_verification_update
      description: Update an existing category verification
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Manually Verified Category.
        required: true
      tags:
      - category-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualCategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualCategoryUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCategoryUpdate'
          description: ''
    patch:
      operationId: category_verifications_update_verification_partial_update
      description: Update an existing category verification
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Manually Verified Category.
        required: true
      tags:
      - category-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedManualCategoryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedManualCategoryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedManualCategoryUpdate'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCategoryUpdate'
          description: ''
  /api/category-verifications/create_verification/:
    post:
      operationId: category_verifications_create_verification_create
      description: Create a new category verification
      tags:
      - category-verifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCategoryCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualCategoryCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualCategoryCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCategoryCreate'
          description: ''
  /api/category-verifications/get_predictions/:
    get:
      operationId: category_verifications_get_predictions_retrieve
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of items per page (max 200)
      - in: query
        name: problematic
        schema:
          type: boolean
        description: Return only problematic manual verifications
      - in: query
        name: scheme
        schema:
          type: integer
        description: Scheme ID to filter predictions
        required: true
      - in: query
        name: source
        schema:
          type: integer
        description: Source ID to filter store products
        required: true
      - in: query
        name: stats_only
        schema:
          type: boolean
          default: false
        description: Return only counts instead of full product data
      - in: query
        name: user
        schema:
          type: integer
        description: User ID for filtering verified products
      - in: query
        name: verified
        schema:
          type: boolean
        description: Return verified products (requires user parameter)
      tags:
      - category-verifications
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Success
  /api/categoryschemes/:
    get:
      operationId: categoryschemes_list
      tags:
      - categoryschemes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryScheme'
          description: ''
  /api/categoryschemes/{id}/:
    get:
      operationId: categoryschemes_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Category Scheme.
        required: true
      tags:
      - categoryschemes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedCategoryScheme'
          description: ''
  /api/categoryschemes/full/:
    get:
      operationId: categoryschemes_full_retrieve
      tags:
      - categoryschemes
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedCategoryScheme'
          description: ''
  /api/nutrients/:
    get:
      operationId: nutrients_list
      tags:
      - nutrients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimpleNutrient'
          description: ''
  /api/nutrients/{id}/:
    get:
      operationId: nutrients_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Nutrient.
        required: true
      tags:
      - nutrients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedNutrient'
          description: ''
  /api/nutrients/full/:
    get:
      operationId: nutrients_full_retrieve
      tags:
      - nutrients
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedNutrient'
          description: ''
  /api/options/:
    get:
      operationId: options_retrieve
      tags:
      - options
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchOptionsResponse'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/sources/:
    get:
      operationId: sources_list
      tags:
      - sources
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimpleSource'
          description: ''
  /api/sources/{id}/:
    get:
      operationId: sources_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Source.
        required: true
      tags:
      - sources
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSource'
          description: ''
  /api/sources/{id}/collection-stats/:
    get:
      operationId: sources_collection_stats_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Source.
        required: true
      tags:
      - sources
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCollectionStats'
          description: ''
  /api/sources/full/:
    get:
      operationId: sources_full_retrieve
      tags:
      - sources
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedSource'
          description: ''
  /api/storeproducts/:
    get:
      operationId: storeproducts_list
      description: List store products with basic information
      tags:
      - storeproducts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimpleStoreProduct'
          description: ''
  /api/storeproducts/{id}/:
    get:
      operationId: storeproducts_retrieve
      description: Get detailed information for a single store product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        description: A unique value identifying this Store Product.
        required: true
      tags:
      - storeproducts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedStoreProduct'
          description: ''
  /api/storeproducts/collection-stats/:
    get:
      operationId: storeproducts_collection_stats_retrieve
      description: 'Collection statistics across all products (or one source via `?source=`):
        FOP / review counts, nutrient stats (count/mean/median/min/max) and additive
        prevalence. Replaces the Collection Stats report''s Elasticsearch aggregations.'
      parameters:
      - in: query
        name: source
        schema:
          type: integer
        description: Restrict the stats to a single source id
      tags:
      - storeproducts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStats'
          description: ''
  /api/storeproducts/export/:
    post:
      operationId: storeproducts_export_create
      description: Server-side CSV export using the same filter body as `/search/`
        plus a `columns` layout (`simple`, `full`, `full_supplemented`). Streams the
        result; rejects requests over EXPORT_MAX_ROWS.
      tags:
      - storeproducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductExportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreProductExportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreProductExportRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/storeproducts/full/:
    get:
      operationId: storeproducts_full_list
      description: Get full details for all store products
      tags:
      - storeproducts
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetailedStoreProduct'
          description: ''
  /api/storeproducts/search/:
    post:
      operationId: storeproducts_search_create
      description: Paginated product search. Replaces the frontend's direct Elasticsearch
        `data/_search` queries (Product Finder, Advanced Search, Product Browser).
        Returns the standard DRF `{count, next, previous, results}` envelope. `page`
        / `page_size` may be given in the body or as query parameters.
      tags:
      - storeproducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductSearchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreProductSearchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreProductSearchRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoreProductSearch'
          description: ''
  /api/storeproducts/store-counts/:
    post:
      operationId: storeproducts_store_counts_create
      description: Per-store product counts for the given filter body, as a list ordered
        by count desc. Replaces the Product Browser `store.name.keyword` terms aggregation.
      tags:
      - storeproducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductSearchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreProductSearchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreProductSearchRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreCount'
          description: ''
  /api/stores/:
    get:
      operationId: stores_list
      tags:
      - stores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SimpleStore'
          description: ''
  /api/stores/{id}/:
    get:
      operationId: stores_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Store.
        required: true
      tags:
      - stores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedStore'
          description: ''
  /api/stores/full/:
    get:
      operationId: stores_full_retrieve
      tags:
      - stores
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedStore'
          description: ''
  /api/token-auth/:
    post:
      operationId: token_auth_create
      tags:
      - token-auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/user-info/:
    get:
      operationId: user_info_retrieve
      tags:
      - user-info
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
components:
  schemas:
    AllergensWarning:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        contains_en:
          type: string
          nullable: true
        contains_fr:
          type: string
          nullable: true
        may_contain_en:
          type: string
          nullable: true
        may_contain_fr:
          type: string
          nullable: true
      required:
      - id
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    CategoryScheme:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        category_count:
          type: integer
          readOnly: true
      required:
      - category_count
      - id
      - name
    CategoryTree:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 512
        code:
          type: string
          maxLength: 256
        scheme:
          type: string
          readOnly: true
        level:
          type: integer
          maximum: 2147483647
          minimum: 0
        verification_info:
          type: object
          nullable: true
          properties:
            verified_by:
              type: string
              format: email
            date_added:
              type: string
              format: date-time
            problematic:
              type: boolean
            notes:
              type: string
          readOnly: true
        prediction_info:
          type: object
          nullable: true
          properties:
            model:
              type: string
            confidence:
              type: number
              format: float
            date_predicted:
              type: string
              format: date-time
          readOnly: true
        children:
          type: string
          readOnly: true
      required:
      - children
      - code
      - id
      - name
      - prediction_info
      - scheme
      - verification_info
    CollectionStats:
      type: object
      properties:
        source_id:
          type: integer
        total:
          type: integer
        with_fop:
          type: integer
        fop_percentage:
          type: number
          format: double
        manually_reviewed:
          type: integer
        reviewed_percentage:
          type: number
          format: double
        nutrients:
          type: array
          items:
            $ref: '#/components/schemas/CollectionStatsNutrient'
        additives:
          type: array
          items:
            $ref: '#/components/schemas/CollectionStatsAdditive'
      required:
      - additives
      - fop_percentage
      - manually_reviewed
      - nutrients
      - reviewed_percentage
      - total
      - with_fop
    CollectionStatsAdditive:
      type: object
      properties:
        label:
          type: string
        term:
          type: string
        count:
          type: integer
        percentage:
          type: number
          format: double
      required:
      - count
      - label
      - percentage
      - term
    CollectionStatsNutrient:
      type: object
      properties:
        label:
          type: string
        nutrient_ids:
          type: array
          items:
            type: integer
        unit:
          type: string
        count:
          type: integer
        mean:
          type: number
          format: double
          nullable: true
        median:
          type: number
          format: double
          nullable: true
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
      required:
      - count
      - label
      - max
      - mean
      - median
      - min
